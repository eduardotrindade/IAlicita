# IAlicita - Portal de Inteligencia em Licitacoes
# Proxy reverso para o container Docker na porta local 13001

server {
    server_name ialicita.it4b.inf.br;

    client_max_body_size 50M;

    # Se existir os snippets de segurança da VPS
    include /opt/mensageria/infrastructure/nginx/snippets/security-headers.conf;

    location / {
        include /opt/mensageria/infrastructure/nginx/snippets/proxy-common.conf;
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}

