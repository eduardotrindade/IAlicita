services:
  ialicita:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ialicita-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:13001:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/check-url || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

